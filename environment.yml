name: py312

channels:
  - conda-forge
  - gurobi
  - defaults

dependencies:
  # Python
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - xgboost
  - joblib
  - matplotlib
  - seaborn
  - geopandas
  - shapely
  - pyproj
  - fiona
  - pyarrow
  - openpyxl

  # NetCDF / raster / gridded data
  - h5netcdf
  - h5py
  - netcdf4
  - xarray
  - rasterio

  # Kriging / interpolation
  - pykrige
  - pyinterpolate

  # Optimization / utilities
  - gurobi
  - jupyterlab
  - ipython
  - black
  - tk

  # R base and R packages used by the R scripts
  - r-base
  - r-data.table
  - r-ggplot2
  - r-sf
  - r-sp
  - r-gstat
  - r-terra
  - r-sftime
  - r-renv
  - r-remotes